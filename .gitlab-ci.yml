stages:
  - test
  - security
  - build
  - deploy

test:
  stage: test
  image: node:18
  script:
    - cd backend
    - npm install
    - npm test

audit_securite:
  stage: security
  image: node:18
  script:
    - cd backend
    - npm install --package-lock-only
    - npm audit --audit-level=high

# --- L'Usine Frontend branchée sur Docker Hub ---
build_frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375  # FIX : Utilise l'alias réseau officiel du service sur GitLab
  script:
    - echo "Connexion sécurisée à Docker Hub..."
    - echo "$DOCKER_HUB_PASSWORD" | docker login -u "aminkrbh" --password-stdin
    - echo "Construction de l'image Frontend..."
    - cd frontend
    - docker build -t aminkrbh/p2b-frontend:latest .
    - echo "Envoi de l'image sur Docker Hub..."
    - docker push aminkrbh/p2b-frontend:latest

deploy:
  stage: deploy
  only:
    - main
  image: docker
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - echo "Déploiement de la base de données et du backend..."
    - kubectl apply -f k8s/postgres-deployment.yaml
    - kubectl apply -f k8s/api-deployment.yaml

    - echo "Déploiement du frontend..."
    - sed -i "s|frontend-image:latest|aminkrbh/p2b-frontend:latest|g" k8s/frontend.yaml
    - kubectl apply -f k8s/frontend.yaml

    - echo "Configuration du routeur Ingress (Traefik)..."
    - kubectl apply -f k8s/ingress.yaml
    - echo "Déploiement de toute l'infrastructure terminé avec succès ! 🚀"
