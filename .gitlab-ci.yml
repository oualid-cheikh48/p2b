stages:
  - test
  - security
  - build
  - deploy

test:
  stage: test
  image: node:18
  script:
    - cd backend
    - npm install
    - npm test

audit_securite:
  stage: security
  image: node:18
  script:
    - cd backend
    - npm install --package-lock-only
    - npm audit --audit-level=high

# --- L'Usine Frontend : Combo Kaniko + Docker Hub ---
build_frontend:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.23.1-debug
    entrypoint: [""]
  script:
    - echo "Configuration de l'authentification Docker Hub pour Kaniko..."
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"aminkrbh\",\"password\":\"$DOCKER_HUB_PASSWORD\"}}}" > /kaniko/.docker/config.json
    - echo "Construction et envoi de l'image..."
    - /kaniko/executor --context $CI_PROJECT_DIR/frontend --dockerfile $CI_PROJECT_DIR/frontend/Dockerfile --destination aminkrbh/p2b-frontend:latest --skip-unused-stages

deploy:
  stage: deploy
  only:
    - main
  image: docker
  before_script:
    - apk add --no-cache curl
    - curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - echo "Déploiement de la base de données et du backend..."
    - kubectl apply -f k8s/postgres-deployment.yaml
    - kubectl apply -f k8s/api-deployment.yaml

    - echo "Déploiement du frontend..."
    # FIX : On pointe bien sur frontend-deployment.yaml ici
    - sed -i "s|frontend-image:latest|aminkrbh/p2b-frontend:latest|g" k8s/frontend-deployment.yaml
    - kubectl apply -f k8s/frontend-deployment.yaml

    - echo "Configuration du routeur Ingress (Traefik)..."
    - kubectl apply -f k8s/ingress.yaml
    - echo "Déploiement de toute l'infrastructure terminé avec succès ! 🚀"
