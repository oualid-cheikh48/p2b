stages:
  - test
  - security
  - deploy

test:
  stage: test
  image: node:18
  script:
    - cd backend
    - npm install
    - npm test

audit_securite:
  stage: security
  image: node:18
  script:
    - cd backend
    - npm install --package-lock-only
    - npm audit --audit-level=high

deploy:
  stage: deploy
  only:
    - main
  image: docker  # <-- On remet l'image d'origine ici !
  script:
    - echo "Déploiement en cours..."
    - kubectl apply -f deployment.yaml