services:
  # 1. Le service de Base de données
  db:
    image: postgres:15-alpine
    container_name: p2b_db
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: p2b_user
      POSTGRES_PASSWORD: p2b_pass
      POSTGRES_DB: p2b_db
    volumes:
      - ./db:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - p2b_network

  # 2. Le service API (Node.js)
  api:
    build: ./backend
    container_name: p2b_api
    restart: always
    environment:
      DATABASE_URL: postgresql://p2b_user:p2b_pass@db:5432/p2b_db
      JWT_SECRET: etnair_secret
      DB_HOST: db
      DB_USER: p2b_user
      DB_PASSWORD: p2b_pass
      MINIO_PUBLIC_URL: http://localhost:9000
      DB_NAME: p2b_db
      PORT: 3000
    ports:
      - "3001:3000"
    depends_on:
      - db
      - minio
    networks:
      - p2b_network

  # 3. Le service pgAdmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: p2b_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@p2b.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - p2b_network

  # 4. Le service MinIO
  minio:
      image: minio/minio:RELEASE.2021-06-17T00-10-46Z
      container_name: p2b_minio
      restart: always
      environment:
        MINIO_ROOT_USER: minioadmin
        MINIO_ROOT_PASSWORD: minioadmin
      ports:
        - "9000:9000"
      command: server /data
      networks:
        - p2b_network

# 5. La définition du réseau commun
networks:
  p2b_network:
    driver: bridge