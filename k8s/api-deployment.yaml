apiVersion: apps/v1
kind: Deployment
metadata:
  name: p2b-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: p2b-api
  template:
    metadata:
      labels:
        app: p2b-api
    spec:
      containers:
      - name: p2b-api
        image: aminkrbh/p2b-api:v1 # Ton image Docker Hub
        env:
        - name: DB_HOST
          value: "postgresql-service" # Magie K8s
        - name: DB_USER
          value: "p2b_user"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: p2b-db-secret # Utilise le coffre-fort K8s !
              key: password
        - name: DB_NAME
          value: "p2b_db"
        - name: PORT
          value: "3000"
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: p2b-api-service
spec:
  type: NodePort
  selector:
    app: p2b-api
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30000 # Port externe pour les navigateurs/Postman