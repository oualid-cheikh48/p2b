apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgresql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
  template:
    metadata:
      labels:
        app: postgresql
    spec:
      containers:
      - name: postgresql
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: "p2b_user"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: p2b-db-secret # Utilise le coffre-fort K8s !
              key: password
        - name: POSTGRES_DB
          value: "p2b_db"
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgresql-service
spec:
  type: NodePort
  selector:
    app: postgresql
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432 # Port externe pour pgAdmin